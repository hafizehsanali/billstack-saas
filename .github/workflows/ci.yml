name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: PHP tests and frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run application tests
        shell: bash
        run: |
          set -o pipefail
          if ! php artisan test --do-not-cache-result --stop-on-failure 2>&1 | tee test-output.log; then
            failure_excerpt="$(
              grep -E 'FAIL|Exception|Error|SQLSTATE|Undefined|Call to|Failed asserting|Expected|Actual|Tests:' \
                test-output.log |
                head -n 80
            )"
            failure_excerpt="${failure_excerpt//'%'/'%25'}"
            failure_excerpt="${failure_excerpt//$'\r'/'%0D'}"
            failure_excerpt="${failure_excerpt//$'\n'/'%0A'}"
            echo "::error title=PHPUnit failure::$failure_excerpt"

            {
              echo "## PHPUnit failure"
              echo '```text'
              tail -n 200 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build production assets
        run: npm run build

      - name: Check dependency advisories
        run: composer audit --locked
